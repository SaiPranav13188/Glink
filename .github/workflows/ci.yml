name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    # Glink needs the macOS 26 SDK (Liquid Glass, Foundation Models).
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Swift version
        run: swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}

      - name: Unit tests (Glink)
        run: swift test

      - name: Unit tests (MCPShieldCore / Tollgate rules + eval set)
        working-directory: Packages/MCPShieldCore
        run: swift test

      - name: Release build
        run: swift build -c release
